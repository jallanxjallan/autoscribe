[package]
name = "autoscribe-service"
version = "0.1.0"
edition = "2024"
description = "Client-side AutoScribe service contract and implementation scaffold"
license = "Proprietary"

[lib]
name = "autoscribe_service"
path = "src/lib.rs"

[[bin]]
name = "autoscribe-service"
path = "src/main.rs"

[dependencies]
rusqlite = { version = "0.40.2", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
