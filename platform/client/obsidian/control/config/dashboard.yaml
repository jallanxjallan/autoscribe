# DASHBOARD DEFINITIONS
# ---------------------
# Paths, action menus and resource lists used by Dashboard.md. The dashboard
# code retains rendering behaviour; the editable inventory lives here.

paths:
  system_status: _control/System Status.md
  editorial_notes_query: _control/queries/Editorial Notes.md

actions:
  plan_manager:
    label: Plan Manager
    macro: macros/plan-manager.js
  write_responses:
    label: Write Responses
    macro: macros/write-responses.js

resource_folders:
  queries:
    label: Queries
    path: _control/queries
  views:
    label: Views
    path: views

# Historical dashboard files suppressed from the resource listing. If you
# restore one intentionally, remove its lowercase basename here.
deprecated_dashboard_files:
  - content index
  - content status
