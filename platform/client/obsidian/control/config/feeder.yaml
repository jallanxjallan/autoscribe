# LEGACY / COMPATIBILITY FEEDER IPC
# ---------------------------------
# Some Control modules still know how to invoke the `obs` feeder. All command
# discovery and IPC size limits are kept here so this compatibility layer can be
# retired or redirected without editing JavaScript.

environment:
  primary_bin: OBSIDIAN_FEEDER_BIN
  secondary_bin: OBS_BIN

candidate_commands:
  - $HOME/Python3.13Env/bin/obs
  - $HOME/.local/bin/obs
  - /usr/local/bin/obs
  - /usr/bin/obs
  - obs

ipc_args:
  - --vault
  - "{vault}"
  - ipc

max_buffer_bytes: 33554432
