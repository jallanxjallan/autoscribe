# LOCAL RUST SERVICE BOUNDARY
# ---------------------------
# Obsidian does not discover/build the Rust service at runtime. The service is
# installed at a stable path by the Control installer, or overridden by SVC_BIN.

environment:
  source_root: AUTOSCRIBE_ROOT
  service_binary: SVC_BIN
  database: AUTOSCRIBE_DATABASE
  pandoc_filter: AUTOSCRIBE_PANDOC_FILTER
  pandoc_parallelism: AUTOSCRIBE_PANDOC_PARALLELISM
  pandoc_bin: PANDOC_BIN

source_root_default: $HOME/Work/Loom
service_binary_default: $HOME/.local/bin/autoscribe-svc

database_default: $HOME/.local/share/autoscribe/service.sqlite
pandoc_filter_relative: platform/pandoc/filters/emit/emit_ndjson.lua
pandoc_parallelism_min: 2
pandoc_bin_default: /usr/bin/pandoc
