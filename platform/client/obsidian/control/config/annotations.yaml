# EDITORIAL ANNOTATIONS
# ---------------------
# One place for annotation keys, display order and renderer/parser limits.
# Directives are a separate processing concept and are intentionally not
# represented in this annotation configuration.

keys:
  comment:
    label: Comment
  query:
    label: Query
  rewrite:
    label: Rewrite
  verify:
    label: Verify
  defer:
    label: Defer

types:
  block:
    label: Block
    description: Callout on the current paragraph
    order: 10
  inline:
    label: Inline
    description: Highlight the selected text
    order: 20

roles:
  block: block
  inline: inline

preview_limit: 120
