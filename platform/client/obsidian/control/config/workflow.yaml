# WORKFLOW / BEHAVIORAL DEFAULTS
# ------------------------------
# Tunable operational choices that are not stored as long-lived note vocabulary.

# Plan step types presented by Define Plan. Removing a kind hides it from new
# plans; it does not rewrite existing saved plans.
step_kinds:
  - llm
  - script
  - rag

# Define Plan UI/ID/snapshot defaults.
define_plan:
  default_step_kind: llm
  default_scope: standing
  default_args_json: "{}"
  step_label_prefix: Step
  status_storage_key: autoscribe.define-plan.status
  snapshot_timeout_ms: 30000
  snapshot_max_buffer_bytes: 16777216
  id_alphabet: 0123456789ABCDEFGHJKMNPQRSTVWXYZ

slug:
  # Alphabet used by Create Instruction's short random suffix.
  suffix_alphabet: abcdefghjkmnpqrstuvwxyz23456789
  suffix_length: 6

writeback:
  # Properties displayed/expected after a successful AI writeback.
  status: needs-review
  producer: ai

# Commit Files policy. `blocked_states` are states that cannot be committed;
# `modes` are the selectable commit modes and their UI descriptions.
commit:
  blocked_states:
    - missing
    - outside repository
    - ambiguous
    - unknown
  modes:
    version:
      label: Version
      description: Tag commit as version; set file state to "versioned"
    lock:
      label: Lock
      description: Tag commit as lock; set file state to "locked"

# Process output limits. Raise only if legitimate snapshot/query output exceeds
# the current ceiling; lower values fail faster on runaway processes.
control_loader:
  asc_snapshot_max_buffer_bytes: 10485760
  rg_max_buffer_bytes: 20971520
