# WORKFLOW / BEHAVIORAL DEFAULTS
# ------------------------------
# Tunable operational choices that are not stored as long-lived note vocabulary.

# Plan step types presented by Plan Manager. Removing a kind hides it from new
# plans; it does not rewrite existing saved plans.
step_kinds:
  - llm
  - script
  - rag

# Plan Manager is vault-independent. It reads committed plans/instructions from
# the unified Control repository and publishes Control/master. Vault repositories
# remain content/run repositories only.
plan_manager:
  control_root: /home/jeremy/Work/Control
  branch: master
  asc_command: /home/jeremy/Python3.13Env/bin/asc
  push_remote: origin
  default_step_kind: llm
  status_storage_key: autoscribe.plan-manager.status

slug:
  # Alphabet used by Create Instruction's short random suffix.
  suffix_alphabet: abcdefghjkmnpqrstuvwxyz23456789
  suffix_length: 6

writeback:
  # Properties displayed/expected after a successful AI writeback.
  status: needs-review
  producer: ai

# Process output limits. Raise only if legitimate snapshot/query output exceeds
# the current ceiling; lower values fail faster on runaway processes.
control_loader:
  asc_snapshot_max_buffer_bytes: 10485760
  rg_max_buffer_bytes: 20971520
