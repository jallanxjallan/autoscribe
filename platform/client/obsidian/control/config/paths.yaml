# FILESYSTEM / COMMAND PATHS
# --------------------------
# Runtime locations and directory names live here. These are intentionally kept
# separate from record vocabulary so you can reorganize the machine without
# touching JavaScript.
#
# `control_mount` is the name exposed inside each Obsidian vault. It is also the
# bootstrap name used to find this config loader, so changing it requires first
# changing/recreating the vault symlink before the new value can be read.

control_mount: _control
# Canonical shared Instructions vault.
instructions_vault: $HOME/Work/Studio/Instructions

# Vault-relative runtime/state directories. Renaming these changes where Control
# reads/writes transient state; it does not migrate an existing directory.
runtime_dir: .autoscribe
selection_dir: selections
workflow_dir: workflow
template_dir: templates

# Folders beginning with this prefix are ignored by content/annotation scans.
excluded_folder_prefix: _

skip_dirs:
  - .git
  - .obsidian
  - node_modules
  - .trash

# Compatibility locations retained from older Control layouts. Remove only after
# you know no project vault still relies on them.
legacy_query_root: _autoscribe

# Environment-variable NAMES, not their values.
environment:
  instructions_vault: AUTOSCRIBE_INSTRUCTIONS_VAULT

current_selection_tmp: autoscribe/obsidian/current-selection

dashboard_candidates:
  - _control/Dashboard.md
  - Dashboard.md

legacy_state_root: $HOME/.local/share/autoscribe/obsidian/vaults
system_status_dir: system-status
