# INSTRUCTION RESOLUTION / PLAN DEFINITIONS
# -----------------------------------------
# Markdown instruction files are authoritative for Obsidian projects and the
# generic Library. This file contains only shared plan/resolution vocabulary;
# record fields and defaults belong in the Markdown templates.

instruction_components:
  standing:
    prefix: std
    injection: always
  rule:
    prefix: rul
    injection: retrieved
  role:
    prefix: rol
    injection: selected
  context:
    prefix: ctx
    injection: selected
  task:
    prefix: tsk
    injection: selected

resolver_properties:
  role:
    payload: role
    prefix: rol.
  context:
    payload: context
    prefix: ctx.
  specifics:
    payload: specifics
    prefix: spc.
