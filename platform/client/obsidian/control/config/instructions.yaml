# INSTRUCTION RESOLUTION / PLAN DEFINITIONS
# -----------------------------------------
# Markdown instruction files are authoritative for Obsidian projects and the
# generic Library. This file contains only shared plan/resolution vocabulary;
# record fields and defaults belong in the Markdown templates.

plan_scopes:
  standing:
    prefix: std
  role:
    prefix: rol
  context:
    prefix: ctx
  task:
    prefix: tsk

resolver_properties:
  role:
    payload: role
    prefix: rol.
  context:
    payload: context
    prefix: ctx.
  specifics:
    payload: specifics
    prefix: spc.
