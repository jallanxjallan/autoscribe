# INTERNAL CONTRACT / NAMESPACE KEYS
# ----------------------------------
# These values were previously buried in modules. They are configuration now,
# but changing them can break compatibility with persisted sessions, server
# payloads or other clients. Treat this file as low-level config.

session_keys:
  dispatch_run: __autoscribeDispatchRunSessions
  current_selection_registry: autoscribe.current-selection.by-vault

step_contract_arg_keys:
  # Keys owned by the plan-step contract. Any additional args entered by the
  # user are kept under the step's `args` object.
  - index
  - kind
  - label
  - instruction
  - instruction_slug
  - instruction_slugs
  - engine
  - script
  - rag_profile
  - model

# Rust service request/response contract for Write Responses.
writeback:
  command: write-responses
  request_version: 1
  result_type: writeback-result
  success_status: committed

# Persisted current-selection record shape/namespaces.
current_selection:
  type: current_selection
  record_type: current_selection
  version: 1
  default_action: save
  browser_registry: __autoscribeCurrentSelections
  source_array_keys:
    - records
    - selected
    - files
    - prompts

# Rust service command used by Dispatch Run.
dispatch:
  command: dispatch-run
  request_version: 1

# Rust service command used when Define Plan saves a plan.
plan_save:
  command: plan-save
  request_version: 1

# `asc` CLI snapshot groups consumed by Control. `expected_type` is checked when
# loading the result, so changing it must match the CLI output.
asc_snapshots:
  registry:
    command: registry
    subcommand: snapshot
    expected_type: autoscribe.registries
    label: asc registry snapshot
  control:
    command: control
    subcommand: snapshot
    expected_type: autoscribe.controls
    label: asc control snapshot

define_plan_snapshot:
  command: define-plan-snapshot

# Service operations used by read/write UI modules. Keeping command names and
# request versions here lets the Rust/API surface evolve without editing JS.
service_operations:
  define_plan_snapshot:
    command: define-plan-snapshot
    request_version: 1
  instructions_sync:
    command: instructions-sync
    request_version: 1
  git_files:
    command: git-files
    request_version: 1
  system_snapshot:
    command: system-snapshot
    request_version: 1
