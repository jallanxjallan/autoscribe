# CONTROLLED VOCABULARIES
# -----------------------
# These are values stored in note frontmatter and therefore become part of the
# long-lived data model. Edit deliberately. Renaming an existing value does NOT
# migrate old notes; it only changes what new/config-driven operations use.
#
# Inline comments after list entries are also used by the Vocabulary Cheatsheet
# macro as human-readable definitions. Keep them short and operational.
#
# Design rule currently agreed: stage and status should not share word stems.

stage:
  # Condition of the text itself, independent of what should happen next.
  - raw       # Unworked source material or first capture.
  - rough     # Coherent draft that still needs substantial editorial work.
  - revised   # Substantively edited and approaching publication quality.
  - final     # Editorially complete; no further substantive work expected.

status:
  # Next operational disposition for the file/text.
  #
  # AI/editorial operations are deliberately expressed as specific verbs rather
  # than generic quality labels. `finish` is used instead of `finalize` so the
  # status vocabulary does not share the `final` stem with stage.
  - write       # Create missing prose from the available material or brief.
  - rewrite     # Recast substantially while preserving the intended meaning.
  - edit        # General editorial intervention when no narrower operation fits.
  - cleanup     # Correct mechanical noise such as typos, punctuation, and formatting.
  - normalize   # Bring spelling, terminology, names, numbers, and style into house form.
  - clarify     # Resolve ambiguity, muddled meaning, or difficult logic.
  - tighten     # Compress sound prose by removing slack, repetition, and weak syntax.
  - restructure # Reorder or reshape paragraphs, sections, or argument flow.
  - develop     # Add needed explanation, context, examples, transitions, or support.
  - verify      # Check factual claims, names, dates, figures, quotations, or terminology.
  - align       # Conform the text to its brief, audience, voice, or project conventions.
  - harmonize   # Make the passage consistent with surrounding material and contributors.
  - dedupe      # Remove repetition within the passage or against compiled material.
  - proofread   # Perform the near-final mechanical pass after substantive editing.
  - finish      # Perform the final publication-readiness pass without substantive rewriting.
  - polish      # Improve surface fluency and finish where the required change is minor.
  - review      # Route for human or general review before another operation is chosen.
  - hold        # Take no action until a dependency, decision, or external event is resolved.
  - done        # No further pipeline operation is currently required.

action:
  # Existing action values found in the current control/templates. These have
  # intentionally NOT been normalized yet. Refine this list manually once you
  # decide exactly what `action` means relative to `status`.
  - human-source   # Obtain or incorporate source material from a human contributor.
  - ai-draft       # Produce a draft with AI.
  - defer          # Postpone the action until later.
  - human-verify   # Send factual or specialist verification to a person.
  - human-research # Send research work to a person.
  # Values used by Create Editorial Note. Keep, rename or merge when you settle
  # the boundary between editorial-note actions and file status.
  - compare        # Compare versions, sources, passages, or alternatives.
  - review         # Perform a general editorial or human review.

origin:
  # Current provenance vocabulary found in templates.
  - human # Material originated with a human rather than an AI process.

producer:
  # Current producer vocabulary used by templates and writeback handling.
  - human # The latest draft or writeback was produced by a human.
  - ai    # The latest draft or writeback was produced by AI.
