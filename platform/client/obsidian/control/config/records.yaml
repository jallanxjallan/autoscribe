# NOTE / RECORD DEFINITIONS
# -------------------------
# Create Note builds its menu directly from this file. Record fields and default
# values live in the referenced Markdown templates; this file only describes the
# creation menu and where each record type belongs.
#
# `group.folder` is the destination folder in the active project vault.
# `template` is relative to that vault; _control is expected to be the symlink
# or directory exposing this control tree.
# `prefix` is the slug prefix.

groups:
  content:
    label: Content
    folder: Content
    initially_open: true
    choices:
      passage:
        label: Passage
        prefix: psg
        template: _control/templates/content/passage.md
      image:
        label: Image
        prefix: img
        template: _control/templates/content/image.md
      opener:
        label: Opener
        prefix: opn
        template: _control/templates/content/opener.md
  materials:
    label: Materials
    folder: Materials
    initially_open: true
    choices:
      topic:
        label: Topic
        prefix: tpc
        template: _control/templates/materials/topic.md
      finding:
        label: Finding
        prefix: fnd
        template: _control/templates/materials/finding.md
  instructions:
    label: Instructions
    folder: Instructions
    initially_open: false
    choices:
      role:
        label: Role
        prefix: rol
        template: _control/templates/instructions/role.md
      context:
        label: Context
        prefix: ctx
        template: _control/templates/instructions/context.md
      reference:
        label: Reference
        prefix: ref
        template: _control/templates/instructions/reference.md
      instruction:
        label: Instruction
        prefix: ins
        template: _control/templates/instructions/instruction.md
editorial_note:
  # Used by Create Editorial Note. These values were previously hard-coded in
  # the macro. `open` is not in vocabulary.yaml/status; that mismatch is
  # preserved so you can resolve it deliberately.
  folder: Editorial Notes
  defaults:
    record: editorial-note
    action: review
    status: open
  dialog:
    title: New Editorial Note
    title_placeholder: Compare regional expansion passages
    action_default: compare
    # Used if the Action box is deliberately left blank.
    blank_action_fallback: review
    clipboard_default: true
