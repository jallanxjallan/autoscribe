# NOTE TYPE DEFINITIONS
# ---------------------
# Set Note Type builds its folded choice menu directly from this file.
# The macro acts only on the active Markdown note: creation and movement are
# deliberately separate operations.
#
# `template` is relative to the active vault; _control exposes this tree.
# `prefix` is the canonical slug prefix and lives here, not in templates.
# `defaults` overrides/adds frontmatter when the type is applied.

groups:
  narrative:
    label: Narrative
    initially_open: true
    choices:
      passage:
        label: Passage
        prefix: psg
        template: _control/templates/content/passage.md
      opener:
        label: Opener
        prefix: opn
        template: _control/templates/content/opener.md
      image:
        label: Image
        prefix: img
        template: _control/templates/content/image.md

  business:
    label: Business
    initially_open: false
    choices:
      thesis:
        label: Thesis
        prefix: ths
        template: _control/templates/business/thesis.md
      brief:
        label: Brief
        prefix: brf
        template: _control/templates/business/brief.md
      analysis:
        label: Analysis
        prefix: anl
        template: _control/templates/business/analysis.md
      model:
        label: Model
        prefix: mdl
        template: _control/templates/business/model.md
      plan:
        label: Plan
        prefix: pln
        template: _control/templates/business/plan.md
      spec:
        label: Spec
        prefix: spc
        template: _control/templates/business/spec.md
      profile:
        label: Profile
        prefix: prf
        template: _control/templates/business/profile.md
      reference:
        label: Reference
        prefix: ref
        template: _control/templates/business/reference.md
      record:
        label: Record
        prefix: rec
        template: _control/templates/business/record.md
      index:
        label: Index
        prefix: idx
        template: _control/templates/business/index.md

  research:
    label: Research
    initially_open: false
    choices:
      topic:
        label: Topic
        prefix: tpc
        template: _control/templates/materials/topic.md
      finding:
        label: Finding
        prefix: fnd
        template: _control/templates/materials/finding.md

  project_instructions:
    label: Instructions — Project
    initially_open: false
    choices:
      role:
        label: Role
        prefix: rol
        template: _control/templates/instructions/role.md
        defaults:
          scope: local
      context:
        label: Context
        prefix: ctx
        template: _control/templates/instructions/context.md
        defaults:
          scope: local
      reference:
        label: Reference
        prefix: ref
        template: _control/templates/instructions/reference.md
        defaults:
          scope: local
      instruction:
        label: Instruction
        prefix: ins
        template: _control/templates/instructions/instruction.md
        defaults:
          scope: local

  global_instructions:
    label: Instructions — Global
    initially_open: false
    choices:
      role:
        label: Role
        prefix: rol
        template: _control/templates/instructions/role.md
        defaults:
          scope: global
      context:
        label: Context
        prefix: ctx
        template: _control/templates/instructions/context.md
        defaults:
          scope: global
      reference:
        label: Reference
        prefix: ref
        template: _control/templates/instructions/reference.md
        defaults:
          scope: global
      instruction:
        label: Instruction
        prefix: ins
        template: _control/templates/instructions/instruction.md
        defaults:
          scope: global

editorial_note:
  folder: Editorial Notes
  defaults:
    record: editorial-note
    action: review
    status: open
  dialog:
    title: New Editorial Note
    title_placeholder: Compare regional expansion passages
    action_default: compare
    blank_action_fallback: review
    clipboard_default: true
