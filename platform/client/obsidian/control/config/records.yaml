# NOTE TYPE DEFINITIONS
# ---------------------
# Set Note Type builds its folded choice menu directly from this file.
# The macro acts only on the active Markdown note: creation and movement are
# deliberately separate operations.
#
# `template` is relative to the active vault; _control exposes this tree.
# `prefix` opts a note type into slug creation and defines its canonical slug prefix.
# Omit it for notes that are not pipeline-discoverable. Slugs are reserved for
# pipeline content and instructions; ordinary business/research/image notes rely
# on normal Obsidian links/embeds instead.
# `defaults` overrides/adds frontmatter when the type is applied.

groups:
  narrative:
    label: Narrative
    initially_open: true
    choices:
      passage:
        label: Passage
        prefix: psg
        template: _control/templates/content/passage.md
      opener:
        label: Opener
        prefix: opn
        template: _control/templates/content/opener.md
      image:
        label: Image
        template: _control/templates/content/image.md

  business:
    label: Business
    initially_open: false
    choices:
      thesis:
        label: Thesis
        template: _control/templates/business/thesis.md
      brief:
        label: Brief
        template: _control/templates/business/brief.md
      analysis:
        label: Analysis
        template: _control/templates/business/analysis.md
      model:
        label: Model
        template: _control/templates/business/model.md
      plan:
        label: Plan
        template: _control/templates/business/plan.md
      spec:
        label: Spec
        template: _control/templates/business/spec.md
      profile:
        label: Profile
        template: _control/templates/business/profile.md
      reference:
        label: Reference
        template: _control/templates/business/reference.md
      record:
        label: Record
        template: _control/templates/business/record.md
      index:
        label: Index
        template: _control/templates/business/index.md

  research:
    label: Research
    initially_open: false
    choices:
      topic:
        label: Topic
        template: _control/templates/materials/topic.md
      finding:
        label: Finding
        template: _control/templates/materials/finding.md

  project_instructions:
    label: Instructions — Project
    initially_open: false
    choices:
      standing:
        label: Standing
        prefix: std
        template: _control/templates/instructions/standing.md
        defaults:
          scope: standing
      rule:
        label: Retrieved Rule
        prefix: rul
        template: _control/templates/instructions/rule.md
        defaults:
          scope: retrieved
      role:
        label: Role
        prefix: rol
        template: _control/templates/instructions/role.md
        defaults:
          scope: local
      context:
        label: Context
        prefix: ctx
        template: _control/templates/instructions/context.md
        defaults:
          scope: local
      task:
        label: Task
        prefix: tsk
        template: _control/templates/instructions/task.md
        defaults:
          scope: local

  global_instructions:
    label: Instructions — Global
    initially_open: false
    choices:
      standing:
        label: Standing
        prefix: std
        template: _control/templates/instructions/standing.md
        defaults:
          scope: standing
      rule:
        label: Retrieved Rule
        prefix: rul
        template: _control/templates/instructions/rule.md
        defaults:
          scope: retrieved
      role:
        label: Role
        prefix: rol
        template: _control/templates/instructions/role.md
        defaults:
          scope: global
      context:
        label: Context
        prefix: ctx
        template: _control/templates/instructions/context.md
        defaults:
          scope: global
      task:
        label: Task
        prefix: tsk
        template: _control/templates/instructions/task.md
        defaults:
          scope: global

editorial_note:
  folder: Editorial Notes
  defaults:
    record: editorial-note
    action: review
    status: open
  dialog:
    title: New Editorial Note
    title_placeholder: Compare regional expansion passages
    action_default: compare
    blank_action_fallback: review
    clipboard_default: true
