# TREE MAINTENANCE
# ----------------
# Files listed here are known superseded Control files. The installer extracts
# the new tree first, then scripts/remove-deprecated.js removes these paths from
# the installed control root. Add to this list when a later refactor retires a
# file; remove an entry only if that path becomes live again.
#
# Paths are relative to control/. Absolute paths and `..` are rejected by the
# removal script as a safety guard.
deprecated_files:
  # Old duplicate annotation implementation, superseded by lib/annotate.js.
  - scripts/lib/annotations.js
  # Old Dataview query, superseded by the List Annotations macro.
  - queries/Editorial Flags.md
  # Superseded by Set Note Type; note creation/movement are separate operations.
  - macros/create-new-new.js
  - macros/create-note.js
  - macros/create-instruction.js
  - macros/apply-template.js
  - scripts/ui/create-instruction.js
  # Commit Files is intentionally outside Control; use the Git plugin/GUI.
  - macros/commit-files.js
  - scripts/ui/commit-files.js
  # Define Plan now lives in its macro; service resolves instruction slugs.
  - scripts/ui/define-plan.js
  - scripts/ui/dispatch-run.js
  - scripts/plans/instruction-resolver.js

