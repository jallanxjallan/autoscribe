[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "obs"
version = "0.1.2"
description = "Obsidian vault scanning and AutoScribe upload/download workflows"
requires-python = ">=3.13"
dependencies = ["PyYAML>=6.0"]

[project.scripts]
obs = "obs.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
